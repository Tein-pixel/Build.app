name: Build generated Android APK
run-name: Build APK ${{ inputs.project_slug }}

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: Unique project key created by Build.APP
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Require a private repository
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_IS_PRIVATE" != "true" ]; then
            echo "Build.APP requires a private repository to protect prompts and generated source." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install icon processing dependency
        run: python3 -m pip install --quiet Pillow

      - name: Validate input and inject HTML, permissions and icon
        id: project
        shell: bash
        env:
          PROJECT_SLUG: ${{ inputs.project_slug }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, re, xml.etree.ElementTree as ET
          from io import BytesIO
          from PIL import Image, ImageOps

          slug = os.environ["PROJECT_SLUG"]
          if not re.fullmatch(r"[a-z0-9-]{1,64}", slug):
              raise SystemExit("Invalid project slug")

          source = pathlib.Path("build-inputs") / slug / "project.json"
          if not source.is_file():
              raise SystemExit(f"Project input not found: {source}")
          project = json.loads(source.read_text(encoding="utf-8"))

          name = str(project.get("name", "Generated App")).strip()
          package_id = str(project.get("packageId", "")).strip()
          html = project.get("html", "")
          version_code = int(project.get("versionCode", 1))
          version_name = str(project.get("versionName", "1.0")).strip()
          permissions = project.get("permissions", [])
          icon_base64 = str(project.get("iconBase64", "")).strip()

          if not name or len(name) > 40 or any(ord(char) < 32 for char in name):
              raise SystemExit("Invalid app name")
          if not re.fullmatch(r"[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+", package_id):
              raise SystemExit("Invalid Android applicationId")
          if not isinstance(html, str) or "<html" not in html.lower() or "</html>" not in html.lower():
              raise SystemExit("Input is not a complete HTML document")
          if len(html.encode("utf-8")) > 2 * 1024 * 1024:
              raise SystemExit("HTML input exceeds the 2 MB limit")
          if version_code < 1:
              raise SystemExit("versionCode must be positive")
          if not isinstance(permissions, list):
              raise SystemExit("permissions must be a list")
          allowed_permissions = {"ACCESS_NETWORK_STATE", "CAMERA", "RECORD_AUDIO", "VIBRATE"}
          if any(not isinstance(permission, str) or permission not in allowed_permissions for permission in permissions):
              raise SystemExit("Input contains an unsupported permission")
          if len(icon_base64) > 2_800_000:
              raise SystemExit("Icon input is too large")
          if not re.fullmatch(r"[A-Za-z0-9._+-]{1,30}", version_name):
              raise SystemExit("Invalid versionName")

          template_app = pathlib.Path("generated-template/app/src/main")
          assets = template_app / "assets"
          assets.mkdir(parents=True, exist_ok=True)
          (assets / "index.html").write_text(html, encoding="utf-8")

          # Add only permissions explicitly selected in Build.APP.
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          manifest_path = template_app / "AndroidManifest.xml"
          manifest_tree = ET.parse(manifest_path)
          manifest_root = manifest_tree.getroot()
          existing = {
              element.get(f"{{{android_ns}}}name", "").removeprefix("android.permission.")
              for element in manifest_root.findall("uses-permission")
          }
          for permission in sorted(set(permissions) - existing):
              manifest_root.insert(0, ET.Element("uses-permission", {
                  f"{{{android_ns}}}name": f"android.permission.{permission}"
              }))

          if icon_base64:
              try:
                  icon_bytes = base64.b64decode(icon_base64, validate=True)
                  icon_image = Image.open(BytesIO(icon_bytes)).convert("RGBA")
                  if icon_image.width < 1 or icon_image.height < 1:
                      raise ValueError("Empty image")
                  icon_image = ImageOps.fit(
                      icon_image, (512, 512), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5)
                  )
                  for density, size in {
                      "mdpi": 48, "hdpi": 72, "xhdpi": 96,
                      "xxhdpi": 144, "xxxhdpi": 192
                  }.items():
                      icon_dir = template_app / "res" / f"mipmap-{density}"
                      icon_dir.mkdir(parents=True, exist_ok=True)
                      icon_image.resize((size, size), Image.Resampling.LANCZOS).save(
                          icon_dir / "ic_launcher.png", format="PNG", optimize=True
                      )
                  application = manifest_root.find("application")
                  if application is None:
                      raise ValueError("Manifest application element missing")
                  application.set(f"{{{android_ns}}}icon", "@mipmap/ic_launcher")
              except Exception as error:
                  raise SystemExit(f"Invalid app icon: {error}")

          manifest_tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"app_id={package_id}\n")
              output.write(f"version_code={version_code}\n")
              output.write(f"version_name={version_name}\n")
              output.write(f"artifact_name=generated-apk-{slug}\n")
              output.write("app_name_b64=" + base64.b64encode(name.encode("utf-8")).decode("ascii") + "\n")
          PY

      - name: Build and sign APK (debug signing key)
        env:
          APP_NAME_B64: ${{ steps.project.outputs.app_name_b64 }}
          APP_ID: ${{ steps.project.outputs.app_id }}
          VERSION_CODE: ${{ steps.project.outputs.version_code }}
          VERSION_NAME: ${{ steps.project.outputs.version_name }}
        run: |
          set -euo pipefail
          APP_NAME="$(printf '%s' "$APP_NAME_B64" | base64 --decode)"
          gradle -p generated-template --no-daemon :app:assembleDebug \
            -PgeneratedAppId="$APP_ID" \
            -PgeneratedAppName="$APP_NAME" \
            -PgeneratedVersionCode="$VERSION_CODE" \
            -PgeneratedVersionName="$VERSION_NAME"

      - name: Verify generated APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs generated-template/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.project.outputs.artifact_name }}
          path: generated-template/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
