name: Expand source and build Build.APP

on:
  push:
    branches: [main]
    paths:
      - 'BuildAPP_Release.part05.b64'
      - '.github/workflows/expand-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble source archive
        run: |
          set -euo pipefail
          cat BuildAPP_Release.part*.b64 > source.tar.xz.b64
          base64 --decode source.tar.xz.b64 > source.tar.xz
          tar -tJf source.tar.xz >/dev/null
          tar -xJf source.tar.xz -C .
          test -f settings.gradle.kts
          test -f app/src/main/java/com/buildapp/builder/MainActivity.kt
          test -f .github/workflows/build-generated.yml

      - name: Patch SDK setup and guard public build repositories
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # android-actions/setup-android v3 no longer supports the obsolete
          # SDK package named "tools". Install only platform-tools explicitly.
          for filename in (
              ".github/workflows/build-builder.yml",
              ".github/workflows/build-generated.yml",
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  "uses: android-actions/setup-android@v3\n",
                  "uses: android-actions/setup-android@v3\n        with:\n          packages: platform-tools\n",
              )
              path.write_text(text, encoding="utf-8")

          # Build input contains user prompts and generated application source.
          # Never upload these files to a public repository.
          client = Path("app/src/main/java/com/buildapp/builder/network/GitHubBuildClient.kt")
          text = client.read_text(encoding="utf-8")
          marker = '        val repo = config.githubRepo.trim()\n'
          guard = '''        val repo = config.githubRepo.trim()
                  val repositoryMetadata = getJson("$API/repos/$owner/$repo", config)
                  check(repositoryMetadata.optBoolean("private", false)) {
                      "Repository build harus PRIVATE. Repository publik tidak boleh menerima prompt atau source aplikasi."
                  }
          '''
          if "Repository build harus PRIVATE" not in text:
              if marker not in text:
                  raise SystemExit("Could not locate GitHub repository validation insertion point")
              text = text.replace(marker, guard, 1)
              client.write_text(text, encoding="utf-8")
          # Return the OkHttp response body from requestHtml(); without this,
          # Kotlin rejects the function's block body as missing a return value.
          llm = Path("app/src/main/java/com/buildapp/builder/network/OpenRouterClient.kt")
          llm_text = llm.read_text(encoding="utf-8")
          old_call = "        client.newCall(request).execute().use { response ->"
          if "return client.newCall(request).execute().use { response ->" not in llm_text:
              if old_call not in llm_text:
                  raise SystemExit("Could not locate OpenRouter response block")
              llm_text = llm_text.replace(old_call, "        return client.newCall(request).execute().use { response ->", 1)
              llm.write_text(llm_text, encoding="utf-8")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Builder APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Builder APK
        uses: actions/upload-artifact@v4
        with:
          name: BuildAPP-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit expanded project files
        run: |
          set -euo pipefail
          rm -f BuildAPP_Release.part*.b64 source.tar.xz.b64 source.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Workflow files are installed separately with a token that has
          # workflow-edit permission; GITHUB_TOKEN commits the project source only.
          git reset -- .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "Add Build.APP source project"
            git push
          fi
